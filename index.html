<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Dogs Pet Style - Experiencia WebAR</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- A-Frame (3D & VR Framework) -->
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>

    <!-- AR.js for A-Frame (Marker-based AR) -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
        /* Ajustes para la cámara de Realidad Aumentada */
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: #000;
        }

        .a-canvas {
            width: 100% !important;
            height: 100% !important;
            top: 0 !important;
            left: 0 !important;
        }

        /* Animación suave para la guía flotante */
        @keyframes pulse-ring {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }

        .scan-frame {
            animation: pulse-ring 3s infinite ease-in-out;
        }
    </style>
</head>
<body class="select-none">

    <!-- Pantalla de Bienvenida / Interacción Inicial (Resuelve error de Autoplay) -->
    <div id="start-overlay" class="fixed inset-0 z-[100] bg-slate-950/90 backdrop-blur-md flex flex-col items-center justify-center p-6 text-center">
        <div class="w-20 h-20 rounded-full bg-gradient-to-tr from-amber-400 via-rose-300 to-amber-200 flex items-center justify-center shadow-xl font-bold text-3xl mb-4 animate-bounce">
            🐾
        </div>
        <h1 class="text-2xl font-bold text-white mb-2">Dogs Pet Style</h1>
        <p class="text-rose-200 text-sm max-w-xs mb-6">Experimenta nuestra tarjeta de presentación en Realidad Aumentada</p>
        
        <button id="start-btn" onclick="startAR()" class="bg-gradient-to-r from-amber-500 to-rose-500 hover:from-amber-600 hover:to-rose-600 text-white font-bold text-base px-8 py-3 rounded-2xl shadow-lg transform transition active:scale-95 flex items-center space-x-2">
            <span>Iniciar Experiencia 3D</span>
            <svg class="w-5 h-5 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
        </button>
    </div>

    <!-- Capa de Interfaz de Usuario (UI Overlay) -->
    <div id="ui-overlay" class="fixed inset-0 pointer-events-none z-50 flex flex-col justify-between p-4">
        
        <!-- Encabezado / Logo Superior -->
        <div class="w-full flex justify-between items-center bg-black/40 backdrop-blur-md rounded-2xl p-3 border border-white/10 pointer-events-auto">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-amber-400 via-rose-300 to-amber-200 flex items-center justify-center shadow-lg font-bold text-amber-900">
                    🐾
                </div>
                <div>
                    <h1 class="text-white font-bold text-base tracking-wide">Dogs Pet Style</h1>
                    <p class="text-rose-200 text-xs">Realidad Aumentada</p>
                </div>
            </div>
            <a href="https://instagram.com/dogspetstyle" target="_blank" rel="noopener noreferrer" 
               class="bg-gradient-to-r from-amber-500 to-rose-400 hover:from-amber-600 hover:to-rose-500 text-white text-xs font-semibold px-4 py-2 rounded-xl shadow-md transition-all flex items-center space-x-1">
               <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>
               <span>Instagram</span>
            </a>
        </div>

        <!-- Indicador central de escaneo -->
        <div id="scan-hint" class="self-center text-center my-auto transition-opacity duration-500">
            <div class="scan-frame w-64 h-64 border-2 border-dashed border-rose-300/80 rounded-3xl flex flex-col items-center justify-center bg-black/20 backdrop-blur-sm p-4 text-white">
                <svg class="w-12 h-12 text-amber-300 mb-2 animate-bounce" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path>
                </svg>
                <p class="font-medium text-sm text-amber-100">Apunta con la cámara a la tarjeta de presentación</p>
                <span class="text-xs text-slate-300 mt-2 bg-black/40 px-3 py-1 rounded-full">Marcador Hiro detectado automáticamente</span>
            </div>
        </div>

        <!-- Control de Audio / Instrucción Inferior -->
        <div class="w-full flex flex-col items-center gap-2 pointer-events-auto">
            <button id="unmute-btn" onclick="toggleAudio()" class="hidden bg-black/60 hover:bg-black/80 backdrop-blur-md text-amber-200 text-xs px-4 py-2 rounded-full border border-amber-400/30 shadow-lg flex items-center space-x-2">
                <span id="audio-icon">🔊</span>
                <span id="audio-text">Toca para Activar Sonido</span>
            </button>
            <div class="bg-black/40 backdrop-blur-md px-4 py-2 rounded-full border border-white/10 text-center">
                <p class="text-white/80 text-xs">Mantén el enfoque para interactuar en 3D</p>
            </div>
        </div>
    </div>

    <!-- Escena A-Frame (AR.js) -->
    <a-scene 
        embedded 
        arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
        renderer="logarithmicDepthBuffer: true; colorManagement: true;"
        vr-mode-ui="enabled: false">

        <!-- Carga de Recursos (Assets) -->
        <a-assets>
            <!-- Logo principal -->
            <img id="logo-img" src="logo.png" crossorigin="anonymous">
            
            <!-- Video Promocional -->
            <video id="promo-video" 
                   src="video_1.mp4" 
                   preload="auto" 
                   loop="true" 
                   crossorigin="anonymous" 
                   playsinline 
                   webkit-playsinline
                   muted>
            </video>

            <!-- Textura Botón Instagram -->
            <img id="insta-icon" src="https://upload.wikimedia.org/wikipedia/commons/a/a5/Instagram_icon.png" crossorigin="anonymous">
        </a-assets>

        <!-- Marcador AR (Por defecto utiliza Marcador HIRO) -->
        <a-marker preset="hiro" id="ar-marker" emitevents="true">
            
            <!-- 1. Logotipo 3D Flotante superior con animación -->
            <a-entity position="0 0.8 -0.5" rotation="-30 0 0">
                <a-plane 
                    src="#logo-img" 
                    width="1.8" 
                    height="0.9" 
                    transparent="true"
                    material="shader: flat; side: double;"
                    animation="property: position; to: 0 0.9 -0.5; dir: alternate; dur: 2000; loop: true; easing: easeInOutSine">
                </a-plane>
            </a-entity>

            <!-- 2. Pantalla 3D para el Video Promocional -->
            <a-entity position="0 0.1 0" rotation="-90 0 0">
                <!-- Marco dorado con degradado -->
                <a-plane width="2.1" height="1.2" color="#D4AF37" position="0 0 -0.01" material="metalness: 0.8; roughness: 0.2;"></a-plane>
                <!-- Video interactivo -->
                <a-plane id="video-plane" 
                         src="#promo-video" 
                         width="2" 
                         height="1.1" 
                         class="clickable"
                         material="shader: flat; side: double;">
                </a-plane>
            </a-entity>

            <!-- 3. Botón Interactivo 3D para Instagram -->
            <a-entity position="0 0.2 0.9" rotation="-60 0 0" id="insta-btn-group">
                <!-- Base del botón -->
                <a-box 
                    id="insta-button"
                    class="clickable"
                    width="1.6" 
                    height="0.4" 
                    depth="0.08" 
                    color="#E1306C"
                    material="metalness: 0.5; roughness: 0.3"
                    animation__hover="property: scale; startEvents: mouseenter; to: 1.05 1.05 1.05; dur: 200"
                    animation__leave="property: scale; startEvents: mouseleave; to: 1 1 1; dur: 200">
                    
                    <!-- Texto flotante en el botón -->
                    <a-text 
                        value="VER INSTAGRAM" 
                        align="center" 
                        color="#FFFFFF" 
                        width="4" 
                        position="0 0 0.05">
                    </a-text>
                </a-box>
            </a-entity>

            <!-- Partículas decorativas de brillo (Sparkles) -->
            <a-entity position="0 0.5 0">
                <a-sphere position="-0.9 0.2 -0.2" radius="0.03" color="#FFD700" animation="property: position; to: -0.9 0.4 -0.2; dir: alternate; dur: 1200; loop: true"></a-sphere>
                <a-sphere position="0.9 0.3 -0.1" radius="0.02" color="#FFC0CB" animation="property: position; to: 0.9 0.5 -0.1; dir: alternate; dur: 1500; loop: true"></a-sphere>
                <a-sphere position="-0.5 0.1 0.6" radius="0.025" color="#FFD700" animation="property: position; to: -0.5 0.3 0.6; dir: alternate; dur: 1800; loop: true"></a-sphere>
            </a-entity>

        </a-marker>

        <!-- Cámara AR con Raycaster para clicks/taps táctiles -->
        <a-entity camera raycaster="objects: .clickable; cursor: rayOrigin: mouse;"></a-entity>

    </a-scene>

    <!-- Script de Control Interactivo -->
    <script>
        const marker = document.getElementById('ar-marker');
        const scanHint = document.getElementById('scan-hint');
        const video = document.getElementById('promo-video');
        const videoPlane = document.getElementById('video-plane');
        const instaButton = document.getElementById('insta-button');
        const unmuteBtn = document.getElementById('unmute-btn');
        const startOverlay = document.getElementById('start-overlay');

        let isAppStarted = false;

        // Iniciar la aplicación tras el toque inicial del usuario
        function startAR() {
            startOverlay.classList.add('hidden');
            isAppStarted = true;
            
            // Cargar e iniciar el buffer de video silenciado
            if (video) {
                video.load();
                video.play().then(() => {
                    video.pause();
                }).catch(err => {
                    console.log("Inicialización de video manejada silenciosamente:", err);
                });
            }
        }

        // Detectar cuando el marcador se visualiza en la cámara
        marker.addEventListener('markerFound', () => {
            scanHint.classList.add('opacity-0');
            unmuteBtn.classList.remove('hidden');
            
            if (isAppStarted && video) {
                const playPromise = video.play();
                if (playPromise !== undefined) {
                    playPromise.catch(error => {
                        console.log("Reproducción automática evitada:", error);
                    });
                }
            }
        });

        // Detectar cuando el marcador se pierde de vista
        marker.addEventListener('markerLost', () => {
            scanHint.classList.remove('opacity-0');
            unmuteBtn.classList.add('hidden');
            if (video && !video.paused) {
                video.pause();
            }
        });

        // Alternar reproducción / pausa al tocar la pantalla del vídeo 3D
        videoPlane.addEventListener('click', () => {
            if (!video) return;
            if (video.paused) {
                video.play().catch(e => console.log("Error al reproducir:", e));
            } else {
                video.pause();
            }
        });

        // Redirección directa a Instagram al tocar el botón 3D
        instaButton.addEventListener('click', () => {
            window.open('https://instagram.com/dogspetstyle', '_blank');
        });

        // Activar/Desactivar Sonido del Vídeo
        function toggleAudio() {
            const icon = document.getElementById('audio-icon');
            const text = document.getElementById('audio-text');
            
            if (!video) return;

            if (video.muted) {
                video.muted = false;
                icon.innerText = '🔇';
                text.innerText = 'Silenciar Video';
            } else {
                video.muted = true;
                icon.innerText = '🔊';
                text.innerText = 'Activar Sonido';
            }
        }
    </script>
</body>
</html>
